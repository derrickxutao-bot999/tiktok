<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巴萨 1925 · 沉默的六个月</title>
<style>
  @font-face { font-family: "NotoSerifSC"; font-weight: 600; src: url(fonts/NotoSerifSC-SemiBold.ttf); }
  @font-face { font-family: "NotoSerifSC"; font-weight: 900; src: url(fonts/NotoSerifSC-Black.ttf); }
  @font-face { font-family: "Cormorant"; font-weight: 500; src: url(fonts/Cormorant-Medium.ttf); }
  @font-face { font-family: "Cormorant"; font-weight: 700; src: url(fonts/Cormorant-Bold.ttf); }
  @font-face { font-family: "Cormorant"; font-weight: 500; font-style: italic; src: url(fonts/Cormorant-Italic.ttf); }
  @font-face { font-family: "Playfair"; font-weight: 700; src: url(fonts/PlayfairDisplay-Bold.ttf); }
  html, body { margin: 0; height: 100%; background: #0b0b0c; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* ------------------------------------------------------------------
   Barcelona 1925 · 沉默的六个月
   A deterministic 28.5 s vertical animation. window.renderFrame(t)
   draws the frame at time t (seconds); render.mjs steps it at 30 fps.
------------------------------------------------------------------- */
const W = 1080, H = 1920, DURATION = 28.5;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

/* ---------- palette ---------- */
const C = {
  paper: "#EAE0CA", night: "#101216", ink: "#1C1A16", cream: "#EDE3CF",
  blau: "#1B4A9C", grana: "#A3203A", gold: "#D4A93A", goldHi: "#FFE08A",
  pitch: "#7D8A5E", red: "#B3202A", iron: "#2C3036", ironHi: "#7E8590",
};

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const easeOutBounce = k => {
  const n = 7.5625, d = 2.75;
  if (k < 1 / d) return n * k * k;
  if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75;
  if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375;
  return n * (k -= 2.625 / d) * k + .984375;
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const r = rng(n * 9301 + 49297); r(); return r(); };

/* ---------- colour ---------- */
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixRGB = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (h1, h2, k, a = 1) => rgba(mixRGB(hex(h1), hex(h2), k), a);
const desat = (h, k) => { const c = hex(h); const g = c[0] * .3 + c[1] * .59 + c[2] * .11; return mixRGB(c, [g, g, g], k); };

/* ---------- timeline helpers ---------- */
// darkness: day (paper) -> night after the ban -> dawn at the finale
const dark = t => clamp(prog(t, 8.45, 9.1) * .9 - prog(t, 23.45, 24.2) * .9, 0, .9);
const inkC = t => mixRGB(hex(C.ink), hex(C.cream), dark(t) / .9);

/* ---------- pre-rendered textures ---------- */
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

const paperTex = (() => {
  const c = makeCanvas(W, H), g = c.getContext("2d"), r = rng(7);
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = r() * H, rad = 80 + r() * 380;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    const dk = r() < .5;
    gr.addColorStop(0, dk ? "rgba(120,90,50,0.07)" : "rgba(255,250,235,0.10)");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 22; d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  g.putImageData(id, 0, 0);
  // fibres
  g.strokeStyle = "rgba(90,70,40,0.05)"; g.lineWidth = 1;
  for (let i = 0; i < 400; i++) { const x = r() * W, y = r() * H, a = r() * 6.28, l = 6 + r() * 26; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  return c;
})();

const grains = [0, 1, 2, 3].map(s => {
  const c = makeCanvas(540, 960), g = c.getContext("2d"), r = rng(100 + s);
  const id = g.createImageData(540, 960), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
});

function glowSprite(col, size) {
  const c = makeCanvas(size, size), g = c.getContext("2d"), h = size / 2;
  const gr = g.createRadialGradient(h, h, 0, h, h, h);
  gr.addColorStop(0, "rgba(255,248,215,1)");
  gr.addColorStop(.18, col);
  gr.addColorStop(.45, col.replace(/,1\)$/, ",0.28)"));
  gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const glowGold = glowSprite("rgba(232,182,72,1)", 64);
const glowBig = glowSprite("rgba(232,182,72,1)", 256);

/* ---------- red seal stamp (Chinese-seal look, Spanish edict text) ---------- */
let seal = null;
function makeSeal() {
  const S = 420, c = makeCanvas(S, S), g = c.getContext("2d"), r = rng(31);
  g.fillStyle = C.red; g.strokeStyle = C.red;
  g.lineWidth = 14; roundRect(g, 20, 20, S - 40, S - 40, 26); g.stroke();
  g.lineWidth = 4; roundRect(g, 42, 42, S - 84, S - 84, 16); g.stroke();
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 230px NotoSerifSC"; g.fillText("禁", S / 2, S / 2 - 22);
  g.font = "700 40px Cormorant"; g.letterSpacing = "6px";
  g.fillText("CLAUSURA · 6 MESES", S / 2, S - 92);
  // worn ink: knock out speckles and scratches
  g.globalCompositeOperation = "destination-out";
  for (let i = 0; i < 1600; i++) { g.globalAlpha = .25 + r() * .75; g.beginPath(); g.arc(r() * S, r() * S, r() * 2.6, 0, 6.29); g.fill(); }
  g.lineWidth = 2;
  for (let i = 0; i < 26; i++) { g.globalAlpha = .5; g.beginPath(); const x = r() * S, y = r() * S; g.moveTo(x, y); g.lineTo(x + (r() - .5) * 90, y + (r() - .5) * 20); g.stroke(); }
  return c;
}
function roundRect(g, x, y, w, h, rr) { g.beginPath(); g.moveTo(x + rr, y); g.arcTo(x + w, y, x + w, y + h, rr); g.arcTo(x + w, y + h, x, y + h, rr); g.arcTo(x, y + h, x, y, rr); g.arcTo(x, y, x + w, y, rr); g.closePath(); }

/* ---------- stadium geometry (world coords) ---------- */
const ROWS = 14, ROW_TOP = 612, ROW_BOT = 850;
const seats = (() => {
  const r = rng(11), out = [];
  const crowd = [C.blau, C.grana, C.blau, C.grana, C.ink, "#E8DCC0", "#5A4632"];
  for (let i = 0; i < ROWS; i++) {
    const k = i / (ROWS - 1), y = lerp(ROW_TOP, ROW_BOT, k);
    const xl = lerp(212, 160, k) + 10, xr = lerp(868, 920, k) - 10;
    const n = Math.floor((xr - xl) / lerp(13.5, 15.5, k));
    for (let j = 0; j <= n; j++) {
      const x = lerp(xl, xr, j / n) + (r() - .5) * 3;
      const dx = (x - 540) / 380, dy = k;
      out.push({
        x, y: y + (r() - .5) * 2, k, rad: lerp(4.2, 5.6, k) + r() * .8,
        col: crowd[(r() * crowd.length) | 0],
        appear: 3.55 + Math.hypot(dx, dy * .6) * .9 + r() * .35,
        fall: 8.75 + r() * .9 + (1 - k) * .2,
        jit: r() * 6.28, refill: 24.05 + Math.abs(dx) * .7 + r() * .3,
        gold: Infinity, src: null,
      });
    }
  }
  // gold: members who kept paying. 72% light up during the six months
  // (density increases over time), the rest arrive from the city.
  const idx = out.map((_, i) => i).sort(() => r() - .5);
  const nA = Math.floor(idx.length * .72);
  for (let i = 0; i < nA; i++) out[idx[i]].gold = 13.5 + 5.3 * Math.sqrt((i + r()) / nA);
  out.cityIdx = idx.slice(nA);
  return out;
})();
const goldTimesA = seats.filter(s => s.gold < 19).map(s => s.gold).sort((a, b) => a - b);

/* ---------- skyline (screen coords, S4) ---------- */
const BASE = 1192;
const skyline = (() => {
  const r = rng(51), b = []; let x = -20;
  while (x < W + 20) {
    const w = 46 + r() * 70, h = 70 + r() * 150;
    b.push({ x, w, h, roof: r() < .3 ? "tri" : (r() < .5 ? "flat" : "step") });
    x += w + 2 + r() * 6;
  }
  const win = [];
  for (const bd of b) for (let yy = BASE - bd.h + 16; yy < BASE - 12; yy += 22) for (let xx = bd.x + 8; xx < bd.x + bd.w - 10; xx += 17) if (r() < .55) win.push({ x: xx, y: yy, on: 19.25 + r() * 1.6 });
  return { b, win };
})();
// gold sparks: from city windows to the remaining dark seats
const sparks = (() => {
  const r = rng(77), out = [];
  const lit = skyline.win;
  seats.cityIdx.forEach((si, i) => {
    const w = lit[(r() * lit.length) | 0];
    const t0 = Math.max(w.on + .1, 19.7 + 2.9 * (i / seats.cityIdx.length) + r() * .3);
    const dur = 1.0 + r() * .5;
    seats[si].src = w; seats[si].gold = t0 + dur;
    out.push({ si, w, t0, dur, bend: (r() - .5) * 260 });
  });
  return out;
})();

/* ---------- camera ---------- */
function camera(t) {
  let s = 1, ty = 0, cy = 760;
  s = lerp(1, 1.05, easeInOut(prog(t, 3.2, 8.2)));
  s = lerp(s, 1, easeInOut(prog(t, 12.6, 18.6)));
  s = lerp(s, .62, easeInOut(prog(t, 19, 20.9)));
  ty = lerp(0, -150, easeInOut(prog(t, 19, 20.9)));
  s = lerp(s, .78, easeInOut(prog(t, 23.4, 25.2)));
  ty = lerp(ty, 40, easeInOut(prog(t, 23.4, 25.2)));
  // shake when the seal hits / gate slams
  let sx = 0, sy = 0;
  const shake = (t0, amp) => { const k = prog(t, t0, t0 + .45); if (k > 0 && k < 1) { const a = amp * (1 - k) * (1 - k); sx += Math.sin(t * 93) * a; sy += Math.cos(t * 71) * a; } };
  shake(8.62, 22); shake(9.42, 10);
  return { s, ty, cy, sx, sy };
}
const toScreen = (cam, x, y) => [540 + (x - 540) * cam.s + cam.sx, cam.cy + (y - cam.cy) * cam.s + cam.ty + cam.sy];

/* ---------- text ---------- */
function charReveal(str, x, y, font, col, t, t0, t1, opt = {}) {
  const per = opt.per ?? .045, align = opt.align ?? "left", spacing = opt.spacing ?? 0;
  ctx.font = font; ctx.textBaseline = "alphabetic";
  const chars = [...str], ws = chars.map(ch => ctx.measureText(ch).width + spacing);
  const total = ws.reduce((a, b) => a + b, 0) - spacing;
  let cx = align === "center" ? x - total / 2 : align === "right" ? x - total : x;
  const out = clamp((t1 - t) / .35);
  chars.forEach((ch, i) => {
    const k = easeOut(prog(t, t0 + i * per, t0 + i * per + .45));
    const a = k * out;
    if (a > 0) { ctx.fillStyle = rgba(col, a); ctx.fillText(ch, cx, y + (1 - k) * 22 + (1 - out) * -10); }
    cx += ws[i];
  });
  return total;
}
function spaced(str, x, y, font, col, a, sp, align = "center") {
  ctx.font = font; ctx.letterSpacing = sp + "px"; ctx.textAlign = align; ctx.fillStyle = rgba(col, a);
  ctx.fillText(str, x + (align === "center" ? sp / 2 : 0), y); ctx.letterSpacing = "0px"; ctx.textAlign = "left";
}

/* subtitle cues: Chinese first, English beneath (left aligned, clear of Douyin UI) */
const CUES = [
  { t0: .55, t1: 3.05, zh: ["一百年前，一阵嘘声", "让一家球会沉默了半年"], en: "A century ago, one crowd's whistles silenced a club." },
  { t0: 3.5, t1: 5.75, label: "1925 · 06 · 14", zh: ["巴塞罗那", "莱斯科尔茨球场"], en: "Les Corts stadium, Barcelona" },
  { t0: 5.9, t1: 8.25, zh: ["西班牙国歌奏响", "看台上嘘声四起"], en: "As the Spanish anthem played, the stands whistled." },
  { t0: 8.75, t1: 10.75, label: "里维拉独裁政府", zh: ["勒令俱乐部", "停止一切活动六个月"], en: "The dictatorship banned all club activity for six months." },
  { t0: 10.85, t1: 12.75, zh: ["球场大门被封", "创始人甘伯被迫离开"], en: "The gates were sealed. Founder Joan Gamper was forced out." },
  { t0: 13.0, t1: 15.9, zh: ["球场空了", "可会员没有离开"], en: "The stadium fell silent. The members stayed." },
  { t0: 16.0, t1: 19.0, zh: ["近一万名会员", "照常缴纳会费"], en: "Some ten thousand socis kept paying their dues." },
  { t0: 19.25, t1: 21.4, zh: ["就连不是球迷的市民", "也伸出了援手"], en: "Even people who weren't fans sent money." },
  { t0: 21.5, t1: 23.3, zh: ["城市，托住了", "它的球会"], en: "A city held its club up." },
  { t0: 24.6, t1: 28.6, zh: ["球会是城市的骄傲", "城市是球会的底气"], en: "The club is the city's pride. The city is the club's strength." },
];
function drawCues(t) {
  const ink = inkC(t), gold = hex(C.gold);
  for (const c of CUES) {
    if (t < c.t0 - .05 || t > c.t1 + .05) continue;
    const x = 92; let y = 1290;
    const out = clamp((c.t1 - t) / .35);
    // gold rule
    const rk = easeOut(prog(t, c.t0, c.t0 + .5));
    ctx.fillStyle = rgba(gold, out); ctx.fillRect(x, y - 70, 96 * rk, 4);
    if (c.label) charReveal(c.label, x + 118, y - 58, "700 30px Playfair", gold, t, c.t0, c.t1, { per: .02, spacing: 3 });
    c.zh.forEach((line, i) => { charReveal(line, x, y + 18 + i * 84, "600 64px NotoSerifSC", ink, t, c.t0 + .1 + i * .28, c.t1); });
    const ek = easeOut(prog(t, c.t0 + .55, c.t0 + 1.1)) * out;
    ctx.font = "italic 500 36px Cormorant"; ctx.fillStyle = rgba(ink, .72 * ek);
    ctx.fillText(c.en, x, y + 18 + c.zh.length * 84 + 6);
  }
}

/* ---------- stadium drawing ---------- */
function drawStadium(t, cam) {
  const d = dark(t) / .9, ink = inkC(t);
  const reveal = easeOut(prog(t, 3.1, 3.9));
  if (reveal <= 0) return;
  ctx.save();
  ctx.translate(540 + cam.sx, cam.cy + cam.ty + cam.sy); ctx.scale(cam.s, cam.s); ctx.translate(-540, -cam.cy);
  ctx.globalAlpha = reveal;
  ctx.translate(0, (1 - reveal) * 60);

  // pitch
  const pc = mixRGB(desat(C.pitch, .25), [34, 40, 36], d);
  ctx.fillStyle = rgba(pc); ctx.beginPath(); ctx.moveTo(110, 902); ctx.lineTo(970, 902); ctx.lineTo(1130, 1160); ctx.lineTo(-50, 1160); ctx.closePath(); ctx.fill();
  // mowing stripes
  for (let i = 0; i < 9; i++) {
    if (i % 2) continue;
    const a0 = i / 9, a1 = (i + 1) / 9;
    ctx.fillStyle = rgba([0, 0, 0], .05);
    ctx.beginPath(); ctx.moveTo(lerp(110, 970, a0), 902); ctx.lineTo(lerp(110, 970, a1), 902); ctx.lineTo(lerp(-50, 1130, a1), 1160); ctx.lineTo(lerp(-50, 1130, a0), 1160); ctx.fill();
  }
  ctx.strokeStyle = rgba([240, 234, 216], .75 - d * .45); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(122, 912); ctx.lineTo(958, 912); ctx.moveTo(540, 912); ctx.lineTo(540, 1160); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(540, 1030, 150, 46, 0, 0, 6.29); ctx.stroke();

  // stand body
  ctx.fillStyle = mix("#D9CDB2", "#1A1D22", d);
  ctx.beginPath(); ctx.moveTo(206, 600); ctx.lineTo(874, 600); ctx.lineTo(926, 862); ctx.lineTo(154, 862); ctx.closePath(); ctx.fill();
  // tier lines
  ctx.strokeStyle = rgba(ink, .25); ctx.lineWidth = 1.4;
  for (let i = 0; i <= ROWS; i++) { const k = i / ROWS, y = lerp(604, 858, k); ctx.beginPath(); ctx.moveTo(lerp(205, 156, k), y); ctx.lineTo(lerp(875, 924, k), y); ctx.stroke(); }
  // aisles
  for (const a of [.25, .5, .75]) { ctx.beginPath(); ctx.moveTo(lerp(206, 874, a), 600); ctx.lineTo(lerp(154, 926, a), 862); ctx.stroke(); }

  drawSeats(t, d);

  // facade with arches
  ctx.fillStyle = mix("#C9BB9C", "#16181C", d); ctx.fillRect(150, 862, 780, 34);
  ctx.fillStyle = mix("#3B342A", "#060708", d);
  for (let i = 0; i < 16; i++) { const x = 170 + i * 47.5; ctx.beginPath(); ctx.moveTo(x, 896); ctx.lineTo(x, 878); ctx.arc(x + 14, 878, 14, Math.PI, 0); ctx.lineTo(x + 28, 896); ctx.fill(); }
  ctx.strokeStyle = rgba(ink, .9); ctx.lineWidth = 3; ctx.strokeRect(150, 862, 780, 34);

  // roof + columns
  ctx.fillStyle = rgba(ink, .92);
  ctx.beginPath(); ctx.moveTo(176, 566); ctx.lineTo(904, 566); ctx.lineTo(880, 536); ctx.lineTo(200, 536); ctx.closePath(); ctx.fill();
  ctx.fillRect(176, 566, 728, 8);
  ctx.lineWidth = 4; ctx.strokeStyle = rgba(ink, .85);
  for (let i = 0; i <= 8; i++) { const x = lerp(196, 884, i / 8); ctx.beginPath(); ctx.moveTo(x, 574); ctx.lineTo(x + (x - 540) * .02, 606); ctx.stroke(); }
  // pediment + name board
  ctx.fillStyle = rgba(ink, .92);
  ctx.beginPath(); ctx.moveTo(430, 536); ctx.lineTo(540, 492); ctx.lineTo(650, 536); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix(C.paper, "#20242A", d); ctx.fillRect(452, 542, 176, 20);
  spaced("LES CORTS", 540, 559, "700 20px Cormorant", ink, 1, 6);

  // flag
  drawFlag(t, d);

  ctx.restore();
}

function drawSeats(t, d) {
  const cream = hex("#E8DCC0");
  for (const s of seats) {
    let x = s.x, y = s.y, a = 0, col = hex(s.col), r = s.rad;
    // S1: crowd appears; agitated when the anthem is whistled
    if (t < 9.8) {
      a = easeOut(prog(t, s.appear, s.appear + .4));
      if (t > 5.95) { const k = prog(t, 5.95, 6.4) * (1 - prog(t, 8.3, 8.7)); y -= Math.abs(Math.sin(t * 15 + s.jit)) * 5 * k; }
      // S2: the crowd drains away
      const fk = prog(t, s.fall, s.fall + .8);
      if (fk > 0) { y += easeIn(fk) * 80; a *= 1 - fk; col = mixRGB(col, desat(s.col, 1), clamp(fk * 2)); }
    }
    // empty seat marks
    ctx.fillStyle = rgba(mixRGB([150, 138, 112], [70, 76, 86], d), .55);
    ctx.fillRect(s.x - r * .6, s.y + r * .3, r * 1.2, 2);
    // S5 refill with colour
    if (t > s.refill) {
      const k = easeOutBack(prog(t, s.refill, s.refill + .45));
      a = clamp(k); col = hex(s.col); r = s.rad * clamp(k, 0, 1.3);
      y -= Math.abs(Math.sin(t * 9 + s.jit)) * 3 * prog(t, 25, 25.6);
    }
    if (a > 0.01) { ctx.fillStyle = rgba(col, a); ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill(); }
    // gold: a member's dues, still paid
    if (t > s.gold && t < 25.2) {
      const k = prog(t, s.gold, s.gold + .35), fade = 1 - prog(t, 24.2, 25.2);
      const pulse = .85 + .15 * Math.sin(t * 3 + s.jit);
      ctx.globalAlpha = clamp(k) * fade * pulse * (.75 + .25 * (1 - k));
      const g = 26 + (1 - k) * 30;
      ctx.drawImage(glowGold, s.x - g / 2, s.y - g / 2, g, g);
      ctx.globalAlpha = 1;

  if (warm > 0) { ctx.globalAlpha = warm * .35; ctx.drawImage(glowBig, 540 - 700, 300, 1400, 900); ctx.globalAlpha = 1; }

  const cam = camera(t);
  drawHook(t);
  drawChrome(t);
  drawStadium(t, cam);
  drawAnthem(t, cam);
  drawGates(t, cam);
  drawSeal(t);
  drawCalendar(t);
  drawCounter(t);
  drawCity(t, cam);
  drawFinale(t);
  drawCues(t);
  drawWipe(t);
  drawPost(t, frame);
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;

/* ---------- live preview (skipped when driven by render.mjs) ---------- */
window.fontsReady = document.fonts.ready.then(() => Promise.all([
  document.fonts.load("600 64px NotoSerifSC", "巴"), document.fonts.load("900 64px NotoSerifSC", "禁"),
  document.fonts.load("700 64px Cormorant", "1925"), document.fonts.load("700 64px Playfair", "1925"), document.fonts.load("500 64px Cormorant", "a"), document.fonts.load("italic 500 64px Cormorant", "a"),
]));
if (!location.search.includes("render")) {
  window.fontsReady.then(() => {
    const seek = parseFloat(new URLSearchParams(location.search).get("t"));
    const start = performance.now() - (isNaN(seek) ? 0 : seek * 1000);
    const loop = now => { renderFrame(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
