<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:"Oswald";font-weight:700;src:url(fonts/Oswald-SemiBold.ttf)}</style></head>
<body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="silhouette.js"></script><script src="atmos.js"></script>
<script>
// key frame: the fingers-to-the-sky celebration, seen from behind, in the rain
const g=document.getElementById("c").getContext("2d");
window.draw=(t=0)=>{const W=1080,H=1920,GY=1500,X=540,FH=660;
 atmosBack(g,W,H,{ground:GY-150,lightX:540,lightY:140});
 const back=[{n:900,len:[18,34],w:1,a:0.16,speed:1.6},{n:380,len:[40,70],w:1.6,a:0.22,speed:2.4}];
 rain(g,W,H,t,{lightX:540,lightY:140,layers:back});
 contactShadow(g,X,GY,170);
 const fig=c=>drawFig(c,X,GY,FH,POSES.skyBack,{name:"MESSI",armband:"A",numberInk:"#2c2c2c",armbandInk:"#2e2e2e",
   rim:{color:"rgba(240,240,232,0.55)",dx:0,dy:4,blur:1}});
 reflect(g,GY,fig,0.3,4);
 fig(g);
 splashes(g,X,GY,900,t);
 rain(g,W,H,t,{lightX:540,lightY:140,layers:[{n:60,len:[110,180],w:3,a:0.2,speed:3.6,blur:2}],seed:41});
 finishGrade(g,W,H);
};
window.ready=document.fonts.load("700 40px Oswald","MESSI10");
</script></body></html>
