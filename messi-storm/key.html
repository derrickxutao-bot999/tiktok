<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:"Oswald";font-weight:700;src:url(fonts/Oswald-SemiBold.ttf)}</style></head>
<body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="silhouette.js"></script>
<script>
const g=document.getElementById("c").getContext("2d");
window.draw=()=>{const W=1080,H=1920;
 const bg=g.createRadialGradient(540,1000,100,540,1000,1300);bg.addColorStop(0,"#9a9d98");bg.addColorStop(1,"#4a4d4a");
 g.fillStyle=bg;g.fillRect(0,0,W,H);
 let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
 for(let i=0;i<60000;i++){const v=rnd();g.fillStyle=v<.5?"rgba(0,0,0,0.05)":"rgba(255,255,255,0.04)";g.fillRect(rnd()*W,rnd()*H,2,2);}
 // soft shadow on the turf
 g.save();g.fillStyle="rgba(0,0,0,0.22)";g.filter="blur(14px)";g.beginPath();g.ellipse(520,1475,120,22,0,0,7);g.fill();g.restore();
 drawFig(g,540,1470,720,POSES.skyBack,{name:"MESSI",numberInk:"#4a4a4a"});
 g.strokeStyle="rgba(30,30,30,0.22)";g.lineWidth=2;
 for(let i=0;i<380;i++){const x=rnd()*W,y=rnd()*H,l=30+rnd()*60;g.beginPath();g.moveTo(x,y);g.lineTo(x-l*0.15,y+l);g.stroke();}
};
window.ready=document.fonts.ready.then(()=>document.fonts.load("700 40px Oswald","MESSI10"));
</script></body></html>
