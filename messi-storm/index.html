<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>梅西 · 风雨（测试）</title>
<style>
  @font-face { font-family: "NotoSerifSC"; font-weight: 600; src: url(fonts/NotoSerifSC-SemiBold.ttf); }
  @font-face { font-family: "NotoSerifSC"; font-weight: 500; src: url(fonts/NotoSerifSC-Medium.ttf); }
  @font-face { font-family: "Oswald"; font-weight: 600; src: url(fonts/Oswald-SemiBold.ttf); }
  html, body { margin: 0; background: #000; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; aspect-ratio: 9 / 16; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* 15 s style test: the storm. 120 bpm grid (0.5 s beats): every hit lands on a beat.
   0–3 s   thousands of characters fly in and slam into a "10"; "他输掉了三个决赛"
   3–10.5  the characters fall as rain onto an empty pitch; one small No.10 stands in it;
           three lost finals drop from the sky and shatter on the grass (4.5, 6.0, 7.5 s)
   10.5–12 the penalty in 2016 goes over the bar
   12–15   his words that night, written into the rain */
const W = 1080, H = 1920, FPS = 30, DURATION = 15;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a)), smooth = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3), easeIn = k => k * k * k;
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const RED = "#e0312b", SKY = "#7cc4f2";

/* ---------- the "10" mosaic ---------- */
const CHARS = "梅西输决赛十号罗萨里奥阿根廷球门点球世界杯美洲杯失利泪水雨夜一米六九";
let MOSAIC = null;
function buildMosaic() {
  const c = mk(W, H), x = c.getContext("2d");
  x.font = "600 1180px Oswald"; x.textAlign = "center"; x.textBaseline = "alphabetic"; x.fillStyle = "#fff"; x.fillText("10", 540, 1430);
  const d = x.getImageData(0, 0, W, H).data, r = rng(10), out = [], step = 27;
  for (let y = 0; y < H; y += step) for (let xx = 0; xx < W; xx += step) {
    if (d[(y * W + xx) * 4 + 3] < 128) continue;
    const a = r() * Math.PI * 2, R = 900 + r() * 900;
    out.push({ x: xx + step / 2, y: y + step / 2, sx: 540 + Math.cos(a) * R, sy: 960 + Math.sin(a) * R, rot: (r() - .5) * 6, ch: CHARS[r() * CHARS.length | 0], t0: r() * .45, red: r() < .05, fall: .7 + r() * .9 });
  }
  MOSAIC = out;
}
function drawMosaic(t) {
  const slam = t >= 1.0, punch = slam ? 1 + .07 * Math.exp(-(t - 1.0) * 9) : 1;
  g.save(); g.translate(540, 960); g.scale(punch, punch); g.translate(-540, -960);
  g.textAlign = "center"; g.textBaseline = "middle"; g.font = "500 22px NotoSerifSC";
  for (const m of MOSAIC) {
    const k = easeOut(prog(t, m.t0, .98)); if (k <= 0) continue;
    let x = lerp(m.sx, m.x, k), y = lerp(m.sy, m.y, k), rot = m.rot * (1 - k);
    const drop = prog(t, 2.6, 3.05);   // at the cut the characters fall and become the rain
    if (drop > 0) y += easeIn(drop) * 2400 * m.fall;
    const lit = slam ? 1 : .35 + .4 * k;
    g.fillStyle = m.red && slam ? RED : `rgba(235,235,232,${lit})`;
    if (drop > .05) { g.globalAlpha = .7; g.fillRect(x - 1.2, y - 80 * drop * m.fall, 2.4, 80 * drop * m.fall); g.globalAlpha = 1; }
    else { g.save(); g.translate(x, y); g.rotate(rot); g.fillText(m.ch, 0, 0); g.restore(); }
  }
  g.restore();
}

/* ---------- the rainy pitch ---------- */
let PITCH = null;
function buildPitch() {
  const c = mk(W, H), x = c.getContext("2d");
  const sky = x.createLinearGradient(0, 0, 0, 760); sky.addColorStop(0, "#050607"); sky.addColorStop(1, "#1c2022"); x.fillStyle = sky; x.fillRect(0, 0, W, 780);
  x.fillStyle = "#0b0d0e"; x.fillRect(0, 610, W, 130);                       // the far stand, dark and empty
  for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(255,255,255,${.03 + (i % 3) * .01})`; x.fillRect(0, 622 + i * 3, W, 1); }
  for (let y = 740, i = 0; y < H; i++) { const h = 18 * Math.pow(1.17, i); x.fillStyle = i % 2 ? "#1b201d" : "#202621"; x.fillRect(0, y, W, h + 1); y += h; }
  x.strokeStyle = "rgba(220,225,220,0.35)"; x.lineWidth = 4;
  x.beginPath(); x.moveTo(0, 1240); x.lineTo(W, 1240); x.stroke();
  x.beginPath(); x.ellipse(540, 1240, 420, 120, 0, 0, Math.PI * 2); x.stroke();
  x.fillStyle = "rgba(220,225,220,0.4)"; x.beginPath(); x.ellipse(540, 1240, 9, 4, 0, 0, Math.PI * 2); x.fill();
  PITCH = c;
}
// a small No.10, seen from behind
function player(x, y, h, kick = 0, col = "#0a0b0c") {
  const u = h / 100;
  g.fillStyle = col;
  const leg = (dx, ang) => { g.save(); g.translate(x + dx * u, y - 46 * u); g.rotate(ang); g.fillRect(-4.5 * u, 0, 9 * u, 46 * u); g.restore(); };
  leg(-6, .05); leg(6, -.05 - kick * 1.1);
  g.beginPath(); g.moveTo(x - 17 * u, y - 82 * u); g.lineTo(x + 17 * u, y - 82 * u); g.lineTo(x + 14 * u, y - 44 * u); g.lineTo(x - 14 * u, y - 44 * u); g.closePath(); g.fill();
  g.fillRect(x - 15 * u, y - 50 * u, 30 * u, 10 * u);
  g.save(); g.translate(x - 17 * u, y - 80 * u); g.rotate(.18); g.fillRect(-5 * u, 0, 9 * u, 34 * u); g.restore();
  g.save(); g.translate(x + 17 * u, y - 80 * u); g.rotate(-.18 - kick * .5); g.fillRect(-4 * u, 0, 9 * u, 34 * u); g.restore();
  g.beginPath(); g.arc(x, y - 92 * u, 10 * u, 0, Math.PI * 2); g.fill();
  g.fillStyle = "rgba(230,232,235,0.55)"; g.font = `600 ${20 * u}px Oswald`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("10", x, y - 66 * u);
}
const DROPS = (() => { const r = rng(7); return Array.from({ length: 420 }, () => ({ x: r() * 1300 - 110, y: r() * H, z: .35 + r() * 1.3 })); })();
function rain(t, dens = 1, slow = 1, col = "205,212,218") {
  g.lineCap = "round";
  for (let i = 0; i < DROPS.length * dens; i++) {
    const d = DROPS[i], sp = 1700 * d.z * slow, len = 46 * d.z * Math.max(.15, slow);
    const y = ((d.y + t * sp) % (H + 200)) - 100, x = d.x - (y / H) * 120 * d.z;
    g.strokeStyle = `rgba(${col},${.12 + d.z * .2})`; g.lineWidth = .8 + d.z * 1.3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 7 * d.z, y + len); g.stroke();
  }
  const r = rng(Math.floor(t * 12));
  g.strokeStyle = "rgba(200,210,215,0.25)"; g.lineWidth = 1.5;
  for (let i = 0; i < 26 * dens; i++) { const y = 760 + Math.pow(r(), .7) * 1100, s = (y - 700) / 1200; g.beginPath(); g.ellipse(r() * W, y, 14 * s, 4 * s, 0, 0, Math.PI * 2); g.stroke(); }
}
function lights(a = 1) {
  g.globalCompositeOperation = "lighter";
  for (const [x, y] of [[90, 120], [990, 120]]) {
    const gr = g.createRadialGradient(x, y, 0, x, y, 520); gr.addColorStop(0, `rgba(230,236,245,${.5 * a})`); gr.addColorStop(.2, `rgba(170,185,205,${.16 * a})`); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(x - 520, y - 520, 1040, 1040);
    g.fillStyle = `rgba(190,205,225,${.05 * a})`; g.beginPath(); g.moveTo(x - 20, y); g.lineTo(x + 20, y); g.lineTo(540 + (x - 540) * .2 + 260, 1500); g.lineTo(540 + (x - 540) * .2 - 260, 1500); g.closePath(); g.fill();
  }
  g.globalCompositeOperation = "source-over";
}

/* ---------- three lost finals fall and shatter ---------- */
const FINALS = [
  { at: 4.5, year: "2014", line: "世界杯决赛  0 : 1", x: 300 },
  { at: 6.0, year: "2015", line: "美洲杯决赛  点球 1 : 4", x: 760 },
  { at: 7.5, year: "2016", line: "美洲杯决赛  点球 2 : 4", x: 520 },
];
const PW = 760, PH = 420;
for (const f of FINALS) {
  f.c = mk(PW, PH); const x = f.c.getContext("2d");
  f.draw = () => {
    x.clearRect(0, 0, PW, PH); x.textAlign = "center";
    x.fillStyle = "#f2f1ec"; x.font = "600 250px Oswald"; x.fillText(f.year, PW / 2, 250);
    x.fillStyle = RED; x.font = "600 58px NotoSerifSC"; x.fillText(f.line, PW / 2, 360);
  };
  const r = rng(f.at * 10); f.bits = [];
  for (let i = 0; i < 9; i++) for (let j = 0; j < 5; j++) f.bits.push({ sx: i * PW / 9, sy: j * PH / 5, vx: (i - 4) * 120 + (r() - .5) * 300, vy: -500 - r() * 700, vr: (r() - .5) * 9 });
}
const LAND = 1210;
function drawFinal(f, t) {
  const fall = prog(t, f.at - .38, f.at);
  if (t < f.at - .38) return;
  const sc = 1.0;
  if (t < f.at) {   // falling, with a motion trail
    const y = lerp(-500, LAND, easeIn(fall));
    for (let k = 3; k >= 0; k--) { g.globalAlpha = k ? .12 : 1; g.drawImage(f.c, f.x - PW / 2 * sc, y - PH + 60 - k * 70, PW * sc, PH * sc); }
    g.globalAlpha = 1; return;
  }
  const d = t - f.at; if (d > 2.2) return;   // shattered pieces fly and settle into the wet grass
  for (const b of f.bits) {
    const px = f.x - PW / 2 + b.sx + b.vx * d, py = LAND - PH + 60 + b.sy + b.vy * d + 1800 * d * d;
    const y = Math.min(py, LAND + 120 + b.sy * .2);
    g.save(); g.globalAlpha = clamp(1.6 - d); g.translate(px + PW / 18, y + PH / 10); g.rotate(b.vr * Math.min(d, .5));
    g.drawImage(f.c, b.sx, b.sy, PW / 9, PH / 5, -PW / 18, -PH / 10, PW / 9, PH / 5); g.restore();
  }
  // splash ring on the grass
  const k = prog(d, 0, .5); g.strokeStyle = `rgba(220,226,230,${.5 * (1 - k)})`; g.lineWidth = 6 * (1 - k);
  g.beginPath(); g.ellipse(f.x, LAND + 40, 60 + 420 * easeOut(k), 18 + 110 * easeOut(k), 0, 0, Math.PI * 2); g.stroke();
}
const shake = t => { let s = 0; for (const a of [1.0, ...FINALS.map(f => f.at), 11.0]) if (t >= a) s += 26 * Math.exp(-(t - a) * 10); return s; };
const flash = t => { let s = 0; for (const a of [1.0, ...FINALS.map(f => f.at)]) if (t >= a) s = Math.max(s, .55 * Math.exp(-(t - a) * 12)); return s; };

/* ---------- the penalty, 2016 ---------- */
function drawPenalty(t) {
  const lt = t - 10.5;
  g.fillStyle = "#060708"; g.fillRect(0, 0, W, H);
  g.drawImage(PITCH, 0, 0);
  lights(.8);
  // the goal, far away, and the bar the ball goes over
  g.strokeStyle = "rgba(235,238,240,0.85)"; g.lineWidth = 9; g.beginPath(); g.moveTo(300, 1010); g.lineTo(300, 830); g.lineTo(780, 830); g.lineTo(780, 1010); g.stroke();
  g.strokeStyle = "rgba(200,205,210,0.18)"; g.lineWidth = 2; for (let x = 310; x < 780; x += 24) { g.beginPath(); g.moveTo(x, 836); g.lineTo(x + 10, 1010); g.stroke(); }
  const kick = smooth(prog(lt, .3, .5)) * (1 - smooth(prog(lt, .7, 1.0)));
  player(540, 1700, 330, kick);
  if (lt > .5) {   // the ball rises over the bar into the dark
    const k = prog(lt, .5, 1.3), bx = lerp(570, 650, k), by = lerp(1640, 520, easeOut(k)), r = lerp(26, 9, k);
    g.fillStyle = "#f4f4f2"; g.beginPath(); g.arc(bx, by, r, 0, Math.PI * 2); g.fill();
  }
  rain(t, .8);
}

/* ---------- his words, written into the rain ---------- */
const QUOTE = ["对我来说，", "国家队生涯结束了。"];
function drawQuote(t) {
  const lt = t - 12;
  g.fillStyle = "#050607"; g.fillRect(0, 0, W, H);
  g.globalAlpha = .45; g.drawImage(PITCH, 0, 0); g.globalAlpha = 1;
  player(540, 1500, 200, 0, "#090a0b");
  rain(t, .9, lerp(1, .25, smooth(prog(lt, 0, 1.2))));   // the rain slows down around the words
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  let n = 0;
  QUOTE.forEach((s, li) => {
    [...s].forEach((ch, i) => {
      const at = .15 + n++ * .11, k = prog(lt, at, at + .3); if (k <= 0) return;
      const x = 540 + (i - (s.length - 1) / 2) * 92, y = 820 + li * 130;
      g.save(); g.globalAlpha = k; g.filter = k < 1 ? `blur(${(1 - k) * 10}px)` : "none";
      g.fillStyle = "#efeeea"; g.font = "600 86px NotoSerifSC"; g.fillText(ch, x, y + (1 - k) * 20); g.restore();
    });
  });
  // rain scratches across the words
  const r = rng(Math.floor(t * 20)); g.strokeStyle = "rgba(5,6,7,0.8)"; g.lineWidth = 3;
  for (let i = 0; i < 14; i++) { const x = 140 + r() * 800, y = 700 + r() * 300; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 10, y + 90 + r() * 80); g.stroke(); }
  const a = smooth(prog(lt, 1.9, 2.4));
  g.fillStyle = `rgba(224,49,43,${a})`; g.font = "500 38px NotoSerifSC"; g.fillText("—— 梅西，2016年美洲杯决赛后", 540, 1110);
}

/* ---------- film finish: vignette and grain ---------- */
const GRAIN = Array.from({ length: 4 }, (_, k) => { const c = mk(540, 960), x = c.getContext("2d"), d = x.createImageData(540, 960), r = rng(k + 3); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; });
function finish(t) {
  const v = g.createRadialGradient(540, 960, 300, 540, 960, 1250); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.75)"); g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "overlay"; g.globalAlpha = .13; g.drawImage(GRAIN[Math.floor(t * FPS) % 4], 0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
}

function renderFrame(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = "none";
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const s = shake(t), r = rng(Math.floor(t * 60));
  g.save(); g.translate((r() - .5) * s, (r() - .5) * s);
  if (t < 3.0) {
    drawMosaic(t);
    // the hook line, in red, after the slam
    const k = prog(t, 1.5, 2.1), out = 1 - prog(t, 2.6, 2.9);
    if (k > 0) { g.textAlign = "center"; g.fillStyle = `rgba(224,49,43,${k * out})`; g.font = "600 74px NotoSerifSC"; g.letterSpacing = "10px"; g.fillText("他输掉了三个决赛", 545, 1640); g.letterSpacing = "0px"; }
  } else if (t < 10.5) {
    const lt = t - 3, z = 1 + .1 * smooth(prog(lt, 0, 7.5));
    g.save(); g.translate(540, 1240); g.scale(z, z); g.translate(-540, -1240);
    g.drawImage(PITCH, 0, 0); lights(1);
    player(540, 1240, 150);
    for (const f of FINALS) drawFinal(f, t);
    g.restore();
    rain(t, 1);
  } else if (t < 12) drawPenalty(t);
  else drawQuote(t);
  g.restore();
  const fl = flash(t); if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl})`; g.fillRect(0, 0, W, H); }
  if (t >= 2.95 && t < 3.05) { g.fillStyle = "rgba(255,255,255,0.25)"; g.fillRect(0, 0, W, H); }
  finish(t);
  const fade = Math.max(1 - prog(t, 0, .2), prog(t, 14.5, 14.95)); if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); }
}
window.DURATION = DURATION; window.renderFrame = renderFrame;
window.ready = document.fonts.ready.then(() => Promise.all(["600 100px Oswald", "600 40px NotoSerifSC", "500 40px NotoSerifSC"].map(f => document.fonts.load(f, "梅西10输决赛对我来说国家队生涯结束了"))))
  .then(() => { buildMosaic(); buildPitch(); FINALS.forEach(f => f.draw()); });
if (!location.search.includes("render")) window.ready.then(() => { const s = performance.now(); const loop = n => { renderFrame(((n - s) / 1000) % DURATION); requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
</script>
</body>
</html>
