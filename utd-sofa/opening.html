<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:"Oswald";font-weight:700;src:url(fonts/Oswald-SemiBold.ttf)}
@font-face{font-family:"NotoSerifSC";font-weight:600;src:url(fonts/NotoSerifSC-SemiBold.ttf)}
@font-face{font-family:"Cormorant";font-style:italic;src:url(fonts/Cormorant-Italic.ttf)}
@font-face{font-family:"VT323";src:url(fonts/VT323-Regular.ttf)}</style></head>
<body style="margin:0;background:#000"><canvas id="c" width="1080" height="1920"></canvas>
<script src="../messi-storm/silhouette.js"></script>
<script src="scene.js"></script>
<script>
// Opening: the real interview, the camera pulls back to the TV in his flat,
// and on "I can't say more" he switches it off.
const g = document.getElementById("c").getContext("2d");
const DURATION = 12.5, FPS_CLIP = 25, N_CLIP = 239, T_OFF = 9.4, Z0 = 1080 / 500;
const TV = { x: 280, y: 720, w: 500, h: 281 }, TVC = [TV.x + TV.w / 2, TV.y + TV.h / 2];
const SUBS = [ // clip starts at 2:29.3 of the Prime Video interview
  [0.15, 3.3, "一直在换、换、换主教练……", "You start changing, changing, changing manager and…"],
  [3.45, 6.3, "但其他方面呢？", "But what about other areas?"],
  [7.85, 9.3, "我不能再多说了。", "I can't say more."],
];
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const seg = (t, a, b) => ease((t - a) / (b - a));
const cache = new Map();
function frame(i) {
  if (!cache.has(i)) cache.set(i, new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null);
    im.src = `footage/clip/${String(i + 1).padStart(4, "0")}.jpg`; }));
  for (const k of cache.keys()) if (k < i - 3) cache.delete(k);
  return cache.get(i);
}
let SUBY = 1650;
function subtitle(zh, en, a) {
  g.save(); g.globalAlpha = a; g.textAlign = "center"; g.textBaseline = "middle";
  g.shadowColor = "rgba(0,0,0,0.85)"; g.shadowBlur = 18;
  g.fillStyle = "#fff"; g.font = "600 58px NotoSerifSC, serif"; g.fillText(zh, 540, SUBY);
  g.fillStyle = "rgba(225,225,230,0.85)"; g.font = "italic 36px Cormorant, serif"; g.fillText(en, 540, SUBY + 72);
  g.restore();
}
window.renderFrame = async t => {
  const on = t < T_OFF, img = on ? await frame(Math.min(N_CLIP - 1, Math.floor(t * FPS_CLIP))) : null;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  // camera: locked on the TV, then pulls back to the room
  const z = Z0 + (1 - Z0) * seg(t, 4.0, 7.6), p = (z - 1) / (Z0 - 1);
  const sx = TVC[0] + (540 - TVC[0]) * p, sy = TVC[1] + (800 - TVC[1]) * p;
  g.setTransform(z, 0, 0, z, sx - TVC[0] * z, sy - TVC[1] * z);
  const R = room2026(g, { tv: on ? "interview" : "off", image: img });
  const remote = t < 10.6 ? seg(t, 8.5, 9.15) * (1 - seg(t, 10.0, 10.6)) : 0;
  rimLit(g, c => bustBack(c, 600, 1395, 92, { sh: 1.8, hair: "short", number: "7", collar: "rgba(255,255,255,0.12)",
    remote, led: t > 9.3 && t < 9.45, bow: seg(t, 10.2, 11.8) }), R.light);
  sofaBack(g, 1590, on ? {} : { rim: "rgba(150,175,215,0.06)" });
  g.setTransform(1, 0, 0, 1, 0, 0); SUBY = 1650 + (1215 - 1650) * p;
  if (!on) { const a = 1 - seg(t, T_OFF, T_OFF + 0.35); if (a > 0) { g.fillStyle = `rgba(200,215,240,${0.12 * a})`; g.fillRect(0, 0, W, H); } }
  grade(g, { seed: 5 + Math.floor(t * 30) % 7 });
  for (const [a, b, zh, en] of SUBS) if (t > a - 0.2 && t < b + 0.2) subtitle(zh, en, Math.min(seg(t, a - 0.15, a + 0.1), 1 - seg(t, b - 0.05, b + 0.2)));
  const ca = 1 - seg(t, 3.6, 4.4);
  if (ca > 0) { g.globalAlpha = ca * 0.75; g.fillStyle = "#fff"; g.font = "600 26px NotoSerifSC, serif"; g.textAlign = "left"; g.fillText("画面：Prime Video", 40, 70); g.globalAlpha = 1; }
};
window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.load("700 40px Oswald", "7"), document.fonts.load("600 40px NotoSerifSC", "一直在换主教练……但其他方面呢？我不能再多说了。画面"),
  document.fonts.load("italic 36px Cormorant", "You"), document.fonts.load("28px VT323", "0")]);
window.draw = () => window.renderFrame(+(new URLSearchParams(location.search).get("t") || 0));
</script></body></html>
